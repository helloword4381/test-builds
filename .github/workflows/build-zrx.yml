name: Build ZRX Plugin

on:
  push:
    branches: [ main ]
    paths:
      - 'TextStyleMgr/**'
      - '.github/workflows/build-zrx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Download ZRX SDK
      shell: pwsh
      run: |
        $url = 'https://github.com/helloword4381/test-builds/releases/download/zrx-sdk-v1/ZWCAD_2026_ZRXSDK_20250905.exe'
        $output = 'ZRXSDK.exe'
        $progressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
        $size = (Get-Item $output).Length
        Write-Host "Downloaded: $size bytes"
        if ($size -lt 1000000) { throw "Download failed" }

    - name: Extract SDK with 7-Zip
      shell: pwsh
      run: |
        $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
        if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
        $extractPath = 'D:\ZRXSDK_EXTRACTED'
        New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
        & $sevenZip x 'ZRXSDK.exe' -o"$extractPath" -y 2>&1 | ForEach-Object { Write-Host $_ }

    - name: Locate SDK root
      id: sdk
      shell: pwsh
      run: |
        $extractPath = 'D:\ZRXSDK_EXTRACTED'
        $incDirs = Get-ChildItem $extractPath -Recurse -Directory -Filter 'inc' -ErrorAction SilentlyContinue |
          Where-Object { Test-Path (Join-Path $_.Parent.FullName 'lib-x64') -PathType Container }
        $sdkRoot = if ($incDirs) { $incDirs[0].Parent.FullName } else { (Get-ChildItem $extractPath -Recurse -Directory | Where-Object { $_.Name -like '*ZRXSDK*' } | Select-Object -First 1).FullName }
        if (-not $sdkRoot) { throw "SDK root not found" }
        if (-not $sdkRoot.EndsWith('\')) { $sdkRoot += '\' }
        Write-Host "SDK root: $sdkRoot"
        echo "sdk_dir=$sdkRoot" >> $env:GITHUB_OUTPUT

    - name: Inspect ZcString API
      shell: pwsh
      env:
        ZRXSDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
      run: |
        $inc = "$env:ZRXSDK_DIR" + 'inc'
        Write-Host "=== Looking for ZcString class definition ==="
        $files = Get-ChildItem $inc -Recurse -Filter '*.h' -ErrorAction SilentlyContinue
        foreach ($f in $files) {
          $m = Select-String -Path $f.FullName -Pattern 'class\s+.*ZcString' -ErrorAction SilentlyContinue
          if ($m) {
            Write-Host "Found ZcString in: $($f.FullName)"
            $m | ForEach-Object { Write-Host "  Line $($_.LineNumber): $($_.Line.Trim())" }
          }
        }
        
        Write-Host "`n=== Looking for ZcString operator LPCTSTR / c_str / kTcharPtr ==="
        $files = Get-ChildItem $inc -Recurse -Filter 'zstring*.h' -ErrorAction SilentlyContinue
        if (-not $files) {
          $files = Get-ChildItem $inc -Recurse -Filter '*string*.h' -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'stdstr|strutil' }
        }
        foreach ($f in $files) {
          Write-Host "`n--- File: $($f.Name) ---"
          Select-String -Path $f.FullName -Pattern 'operator\s+(LPCTSTR|const\s+TCHAR|const\s+wchar)|c_str\(|kTcharPtr|kwsz\(|const ZTCHAR' -ErrorAction SilentlyContinue | 
            Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.LineNumber): $($_.Line.Trim())" }
        }
        
        Write-Host "`n=== Looking for TextStyleTableRecord members ==="
        $files2 = Get-ChildItem $inc -Recurse -Filter '*.h' -ErrorAction SilentlyContinue
        foreach ($f in $files2) {
          $m = Select-String -Path $f.FullName -Pattern 'class\s+.*ZcDbTextStyleTableRecord' -ErrorAction SilentlyContinue
          if ($m) {
            Write-Host "`nFound ZcDbTextStyleTableRecord in: $($f.FullName)"
            # Print lines around class definition (members)
            $lines = Get-Content $f.FullName
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'oblique|fileName|bigFontFileName|textSize|xScale|setName|setFileName|setBigFontFileName|setTextSize|setXScale') {
                $line = $lines[$i].Trim()
                if ($line -and $line -notmatch '^//') {
                  Write-Host "  $($i+1): $line"
                }
              }
            }
          }
        }

    - name: Build ZRX plugin
      shell: pwsh
      env:
        ZRXSDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
      run: |
        msbuild "TextStyleMgr\TextStyleMgr.sln" /p:Configuration=Release /p:Platform=x64 /m /v:minimal
      continue-on-error: true

    - name: Locate built .zrx file
      id: artifact
      shell: pwsh
      run: |
        $zrxFiles = Get-ChildItem -Path 'TextStyleMgr' -Recurse -Filter '*.zrx' -ErrorAction SilentlyContinue
        if (-not $zrxFiles) {
          $zrxFiles = Get-ChildItem -Path '.' -Recurse -Filter '*.zrx' -ErrorAction SilentlyContinue
        }
        if (-not $zrxFiles) { Write-Host "No .zrx file found"; exit 1 }
        $zrxPath = $zrxFiles[0].FullName
        Write-Host "Found ZRX file: $zrxPath"
        echo "zrx_path=$zrxPath" >> $env:GITHUB_OUTPUT
        echo "zrx_name=$($zrxFiles[0].Name)" >> $env:GITHUB_OUTPUT

    - name: Upload ZRX artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.zrx_name }}
        path: ${{ steps.artifact.outputs.zrx_path }}
        if-no-files-found: error
        retention-days: 90
