name: Build ZRX Plugin

on:
  push:
    branches: [ main ]
    paths:
      - 'TextStyleMgr/**'
      - '.github/workflows/build-zrx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Download ZRX SDK
      shell: pwsh
      run: |
        $url = 'https://github.com/helloword4381/test-builds/releases/download/zrx-sdk-v1/ZWCAD_2026_ZRXSDK_20250905.exe'
        $output = 'ZRXSDK.exe'
        $progressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
        $size = (Get-Item $output).Length
        Write-Host "Downloaded: $size bytes"
        if ($size -lt 1000000) { throw "Download failed" }

    - name: Extract SDK with 7-Zip
      shell: pwsh
      run: |
        $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
        if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
        $extractPath = 'D:\ZRXSDK_EXTRACTED'
        New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
        & $sevenZip x 'ZRXSDK.exe' -o"$extractPath" -y 2>&1 | ForEach-Object { Write-Host $_ }

    - name: Locate SDK root
      id: sdk
      shell: pwsh
      run: |
        $extractPath = 'D:\ZRXSDK_EXTRACTED'
        $incDirs = Get-ChildItem $extractPath -Recurse -Directory -Filter 'inc' -ErrorAction SilentlyContinue |
          Where-Object { Test-Path (Join-Path $_.Parent.FullName 'lib-x64') -PathType Container }
        $sdkRoot = if ($incDirs) { $incDirs[0].Parent.FullName } else { (Get-ChildItem $extractPath -Recurse -Directory | Where-Object { $_.Name -like '*ZRXSDK*' } | Select-Object -First 1).FullName }
        if (-not $sdkRoot) { throw "SDK root not found" }
        if (-not $sdkRoot.EndsWith('\')) { $sdkRoot += '\' }
        Write-Host "SDK root: $sdkRoot"
        echo "sdk_dir=$sdkRoot" >> $env:GITHUB_OUTPUT

    - name: Ensure RC file is UTF-16 LE BOM
      shell: pwsh
      run: |
        $rcPath = 'TextStyleMgr\TextStyleMgr.rc'
        $bytes = [System.IO.File]::ReadAllBytes($rcPath)
        $isUtf16LE = ($bytes.Length -ge 2 -and $bytes[0] -eq 0xFF -and $bytes[1] -eq 0xFE)
        if (-not $isUtf16LE) {
          Write-Host "Converting $rcPath to UTF-16 LE BOM..."
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            $bytes = $bytes[3..($bytes.Length-1)]
          }
          $content = [System.Text.Encoding]::UTF8.GetString($bytes)
          $utf16 = [System.Text.Encoding]::Unicode.GetBytes($content)
          $bom = [byte[]](0xFF, 0xFE)
          $allBytes = $bom + $utf16
          [System.IO.File]::WriteAllBytes($rcPath, $allBytes)
          Write-Host "Converted successfully"
        } else {
          Write-Host "$rcPath is already UTF-16 LE BOM"
        }

    - name: Ensure source files have UTF-8 BOM
      shell: pwsh
      run: |
        $sourceFiles = Get-ChildItem -Path 'TextStyleMgr' -Include '*.cpp','*.h' -Recurse
        foreach ($file in $sourceFiles) {
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
          if (-not $hasBom) {
            Write-Host "Adding UTF-8 BOM to $($file.FullName)"
            $bom = [byte[]](0xEF, 0xBB, 0xBF)
            $allBytes = $bom + $bytes
            [System.IO.File]::WriteAllBytes($file.FullName, $allBytes)
          }
        }
        Write-Host "All source files have UTF-8 BOM"

    - name: Build ZRX plugin
      shell: pwsh
      env:
        ZRXSDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
      run: |
        $logFile = 'build_log.txt'
        try {
          msbuild "TextStyleMgr\TextStyleMgr.sln" /p:Configuration=Release /p:Platform=x64 /m /v:diag 2>&1 | Tee-Object -FilePath $logFile
          $exitCode = $LASTEXITCODE
        } catch {
          $exitCode = 1
        }
        # Always upload log regardless of success/failure
        Write-Host "Build exit code: $exitCode"
        exit $exitCode

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build_log
        path: build_log.txt
        if-no-files-found: warn
        retention-days: 7

    - name: Locate built plugin file
      if: success()
      id: artifact
      shell: pwsh
      run: |
        Write-Host "=== Searching for .zrx files ==="
        $pluginFiles = Get-ChildItem -Path 'TextStyleMgr' -Recurse -Filter '*.zrx' -ErrorAction SilentlyContinue
        if (-not $pluginFiles) {
          $pluginFiles = Get-ChildItem -Path '.' -Recurse -Filter '*.zrx' -ErrorAction SilentlyContinue
        }
        
        if (-not $pluginFiles) {
          Write-Host "No .zrx file found. Searching for .dll as fallback..."
          $dllFiles = Get-ChildItem -Path 'TextStyleMgr' -Recurse -Filter 'TextStyleMgr*.dll' -ErrorAction SilentlyContinue
          if (-not $dllFiles) {
            $dllFiles = Get-ChildItem -Path 'TextStyleMgr' -Recurse -Filter '*.dll' -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match 'Release|Debug|x64' -and $_.Name -notmatch '^(mfc|afx|msvcr|vcruntime|ucrt|concrt|api-ms|mfcm)' }
          }
          if ($dllFiles) {
            $dll = $dllFiles[0]
            $zrxPath = [System.IO.Path]::ChangeExtension($dll.FullName, '.zrx')
            Copy-Item $dll.FullName -Destination $zrxPath -Force
            Write-Host "Renamed $($dll.FullName) -> $zrxPath"
            $pluginFiles = @([PSCustomObject]@{ FullName = $zrxPath; Name = [System.IO.Path]::GetFileName($zrxPath) })
          }
        }
        
        Write-Host "`n=== Build output directory listing ==="
        Get-ChildItem -Path 'TextStyleMgr' -Recurse -Include '*.zrx','*.dll','*.lib','*.pdb','*.exp' -ErrorAction SilentlyContinue |
          ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
        
        if (-not $pluginFiles) { 
          Write-Host "ERROR: No .zrx or .dll plugin file found"
          exit 1 
        }
        $zrxPath = $pluginFiles[0].FullName
        Write-Host "Found plugin file: $zrxPath"
        echo "zrx_path=$zrxPath" >> $env:GITHUB_OUTPUT
        echo "zrx_name=$($pluginFiles[0].Name)" >> $env:GITHUB_OUTPUT

    - name: Upload ZRX artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.zrx_name }}
        path: ${{ steps.artifact.outputs.zrx_path }}
        if-no-files-found: error
        retention-days: 90
