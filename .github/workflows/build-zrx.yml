name: Build ZRX Plugin

on:
  push:
    branches: [ main ]
    paths:
      - 'TextStyleMgr/**'
      - '.github/workflows/build-zrx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Download ZRX SDK
      shell: pwsh
      run: |
        $url = 'https://github.com/helloword4381/test-builds/releases/download/zrx-sdk-v1/ZWCAD_2026_ZRXSDK_20250905.exe'
        $output = 'ZRXSDK.exe'
        Write-Host "Downloading SDK from $url"
        $progressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
        $size = (Get-Item $output).Length
        Write-Host "Downloaded: $size bytes"
        if ($size -lt 1000000) {
          throw "Download failed or file too small"
        }

    - name: Extract SDK with 7-Zip
      shell: pwsh
      run: |
        $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
        if (-not $sevenZip) {
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
        }
        Write-Host "Using 7-Zip: $($sevenZip.Source ?? $sevenZip)"
        $extractPath = 'D:\ZRXSDK_EXTRACTED'
        New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
        & $sevenZip x 'ZRXSDK.exe' -o"$extractPath" -y 2>&1 | ForEach-Object { Write-Host $_ }

    - name: Locate SDK root
      id: sdk
      shell: pwsh
      run: |
        $extractPath = 'D:\ZRXSDK_EXTRACTED'
        $incDirs = Get-ChildItem $extractPath -Recurse -Directory -Filter 'inc' -ErrorAction SilentlyContinue |
          Where-Object { Test-Path (Join-Path $_.Parent.FullName 'lib-x64') -PathType Container }
        if ($incDirs) {
          $sdkRoot = $incDirs[0].Parent.FullName
        } else {
          $candidates = Get-ChildItem $extractPath -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like '*ZRXSDK*' -or $_.Name -like '*ZRX*' }
          if ($candidates) {
            $sdkRoot = $candidates[0].FullName
          }
        }
        if (-not $sdkRoot) {
          Get-ChildItem $extractPath -Directory | Select-Object FullName
          throw "SDK root not found"
        }
        if (-not $sdkRoot.EndsWith('\')) { $sdkRoot += '\' }
        Write-Host "SDK root: $sdkRoot"
        echo "sdk_dir=$sdkRoot" >> $env:GITHUB_OUTPUT

    - name: Inspect SDK API (TextStyleTableRecord)
      shell: pwsh
      env:
        ZRXSDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
      run: |
        $inc = "$env:ZRXSDK_DIR" + 'inc'
        Write-Host "=== Searching for TextStyleTableRecord header ==="
        $stylHeader = Get-ChildItem $inc -Recurse -Filter 'zdbstyl.h' -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($stylHeader) {
          Write-Host "Found: $($stylHeader.FullName)"
          Write-Host "=== Searching for member functions ==="
          Select-String -Path $stylHeader.FullName -Pattern 'oblique|fileName|bigFontFileName|textSize|xScale|setName|setFileName|setBigFontFileName|setTextSize|setXScale' | ForEach-Object { Write-Host "$($_.LineNumber): $($_.Line.Trim())" }
        } else {
          Write-Host "zdbstyl.h not found, searching any header with TextStyleTableRecord"
          Get-ChildItem $inc -Recurse -Filter '*.h' | ForEach-Object {
            $matches = Select-String -Path $_.FullName -Pattern 'class.*ZcDbTextStyleTableRecord' -ErrorAction SilentlyContinue
            if ($matches) { Write-Host "Found in: $($_.FullName)" }
          }
        }
        
        Write-Host "`n=== Searching for ZcString API ==="
        $stringHeader = Get-ChildItem $inc -Recurse -Filter 'zcstring.h' -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $stringHeader) {
          $stringHeader = Get-ChildItem $inc -Recurse -Filter '*.h' -ErrorAction SilentlyContinue | Where-Object { Select-String -Path $_.FullName -Pattern 'class.*ZcString' -Quiet -ErrorAction SilentlyContinue } | Select-Object -First 1
        }
        if ($stringHeader) {
          Write-Host "Found: $($stringHeader.FullName)"
          Select-String -Path $stringHeader.FullName -Pattern 'operator LPCTSTR|operator const TCHAR|c_str|kTcharPtr|kwsz|const TCHAR' -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { Write-Host "$($_.LineNumber): $($_.Line.Trim())" }
        }
        
        Write-Host "`n=== Searching for RTNORM ==="
        Get-ChildItem $inc -Recurse -Filter '*.h' | ForEach-Object {
          $m = Select-String -Path $_.FullName -Pattern '#define.*RTNORM|RTNORM\s*=' -ErrorAction SilentlyContinue
          if ($m) { $m | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" } }
        } | Select-Object -First 10
        
        Write-Host "`n=== Searching for ads_name and zcedSSGet ==="
        Get-ChildItem $inc -Recurse -Filter '*.h' | ForEach-Object {
          $m = Select-String -Path $_.FullName -Pattern 'zcedSSGet|ads_name|zcedSSLength|zcedSSName|zcedSSFree' -ErrorAction SilentlyContinue
          if ($m) { $m | Select-Object -First 3 | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" } }
        }

    - name: Build ZRX plugin
      shell: pwsh
      env:
        ZRXSDK_DIR: ${{ steps.sdk.outputs.sdk_dir }}
      run: |
        Write-Host "Using ZRXSDK_DIR: $env:ZRXSDK_DIR"
        msbuild "TextStyleMgr\TextStyleMgr.sln" /p:Configuration=Release /p:Platform=x64 /m /v:minimal
      continue-on-error: true

    - name: Upload build logs on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          TextStyleMgr/x64/Release/*.log
          TextStyleMgr/x64/Debug/*.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Locate built .zrx file
      id: artifact
      shell: pwsh
      run: |
        $zrxFiles = Get-ChildItem -Path 'TextStyleMgr' -Recurse -Filter '*.zrx' -ErrorAction SilentlyContinue
        if (-not $zrxFiles) {
          $zrxFiles = Get-ChildItem -Path '.' -Recurse -Filter '*.zrx' -ErrorAction SilentlyContinue
        }
        if (-not $zrxFiles) {
          Write-Host "No .zrx file found"
          exit 1
        }
        $zrxPath = $zrxFiles[0].FullName
        Write-Host "Found ZRX file: $zrxPath"
        echo "zrx_path=$zrxPath" >> $env:GITHUB_OUTPUT
        echo "zrx_name=$($zrxFiles[0].Name)" >> $env:GITHUB_OUTPUT

    - name: Upload ZRX artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.zrx_name }}
        path: ${{ steps.artifact.outputs.zrx_path }}
        if-no-files-found: error
        retention-days: 90
