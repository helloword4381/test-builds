<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一建学习系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="logo">一建学习系统</div>
      <nav class="nav">
        <a href="#" data-page="course" class="nav-item active">课程学习</a>
        <a href="#" data-page="quiz" class="nav-item">每日一练</a>
        <a href="#" data-page="plan" class="nav-item">学习计划</a>
        <a href="#" data-page="wrong" class="nav-item">错题本</a>
        <a href="#" data-page="import" class="nav-item">资料导入</a>
        <a href="#" data-page="settings" class="nav-item">设置</a>
      </nav>
      <div class="sidebar-footer">
        <div id="study-today">今日学习: 0分钟</div>
        <div id="rest-timer" class="rest-timer hidden">
          <span class="rest-label">休息中</span>
          <span class="rest-time">10:00</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <h1 id="page-title">课程学习</h1>
        <div class="header-actions">
          <button id="btn-speak" class="btn-icon" title="朗读当前内容">朗读</button>
          <button id="btn-theme" class="btn-icon" title="切换主题">主题</button>
        </div>
      </header>

      <div id="content" class="content">
        <!-- 动态内容区域 -->
      </div>
    </main>
  </div>

  <!-- 全局模态框 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">标题</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="js/data-store.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
